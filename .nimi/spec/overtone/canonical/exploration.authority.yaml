format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.exploration
units:
  - id: definition.overtone.exploration.music-playground
    kind: definition
    title: Music playground
    meaning: App-owned creative intent and transient AI proposals turn an idea into three contrasting arrangements and lyric sketches; energy and surprise are prompt intent, never guaranteed Runtime parameters or measured audio facts.
  - id: rule.overtone.exploration.r001
    kind: rule
    title: Honest creative directions
    modality: must
    statement: Obtain AI directions only through protected text candidates, validate all three complete proposals, label them as ideas until actual audio exists, and apply a proposal only through explicit selection; a failed or stale response cannot replace the draft or create recordings. Show the actual generation target and withhold new generation while the visible idea differs from the explicitly applied idea; let the author apply the new idea or return to the current direction.
    condition: When requesting or applying musical direction proposals.
    failure: Keep the existing draft and show the actual failure; discard responses belonging to a closed project.
    relations:
      - type: applies_to
        target: definition.overtone.exploration.music-playground
  - id: rule.overtone.exploration.r002
    kind: rule
    title: Reinterpret words without audio-reference claims
    modality: must
    statement: Build a selected take's new interpretation from immutable prompt and lyric snapshots plus explicit user intent; explain that its melody may change, submit only admitted prompt and lyrics, and append a prompt-origin take with optional text-lineage parentTakeId after verified audio completion. Bring the author to the exploration stage so progress, cancellation, errors and resulting directions are visible; reject conflicting reinterpretation while music generation or song arrangement is active.
    condition: When exploring a new direction from a selected take.
    failure: Preserve the source take and dispatch no unsupported remix, extend or reference-audio request.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.exploration.music-playground
  - id: rule.overtone.exploration.r003
    kind: rule
    title: Local listening edits and explicit export
    modality: must
    statement: Apply playback speed, loop and trim as reversible local audition controls over the saved canonical audio timeline; derive edit and export frame coordinates from its measured sample rate and frame count, never from a browser-decoded buffer. Preserve the source take and expose its saved file location through protected asset reveal, or save a separately labelled float32 trimmed WAV through bounded PCM reads and reveal the completed file on explicit user action. Export keeps source sample values, rate and channels regardless of audition speed or volume; browser audition timing is not a sample-accurate edit result, AI edit or Realm publication. An opaque playback URL is not a browser download contract and a blocked navigation must never be presented as successful export.
    condition: When auditioning or exporting a completed take.
    failure: Disable actions without validated owned audio, a ready player or a valid trim; preserve source bytes and show read, playback or export errors without success claims.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
