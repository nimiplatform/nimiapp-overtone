format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.failure
units:
  - id: definition.overtone.failure.reason-code
    kind: definition
    title: User-facing reason code
    meaning: A protected Local App or App Access reason code that the renderer preserves with its typed action hint and user-readable context rather than swallowing it or coercing it into success.
  - id: definition.overtone.failure.reason-local-registration-required
    kind: definition
    title: Local development registration required
    meaning: local-development-registration-required explains that the official pnpm dev flow must register this project through Nimi Desktop; actionHint is restart_official_nimi_app_dev_command.
  - id: definition.overtone.failure.reason-local-session-revoked
    kind: definition
    title: Local App session revoked
    meaning: local-development-session-revoked explains that Nimi access for the running app is unavailable; actionHint is retry_when_nimi_access_is_available.
  - id: definition.overtone.failure.reason-local-project-changed
    kind: definition
    title: Local project identity changed
    meaning: local-development-project-changed explains that project identity no longer matches the Desktop registration; actionHint is restore_registered_project_identity.
  - id: definition.overtone.failure.reason-text-candidate-failed
    kind: definition
    title: Text candidate failed
    meaning: A failure from NimiLocalAppClient.ai.text.generateCandidate is shown on the brief or lyrics surface and creates no fabricated text candidate.
  - id: definition.overtone.failure.reason-music-app-access-unavailable
    kind: definition
    title: Music App Access unavailable
    meaning: Music generation renders a persistent warning and disabled submission when its App intent is not configured or the protected operation is unavailable; reference, extend, and remix iteration remains unavailable until its inputs are admitted.
  - id: definition.overtone.failure.reason-realm-publish-unavailable
    kind: definition
    title: Realm publish App Access unavailable
    meaning: Realm publish remains disabled and explains that an admitted App Access publish operation is required; raw Realm bearer-token transport is forbidden.
  - id: rule.overtone.failure.r001
    kind: rule
    title: Preserve host failure posture
    modality: must
    statement: Preserve Local App reasonCode and actionHint through the auth projection and expose a typed unavailable or action-required surface without app-owned login, caller registration, or pseudo-success state.
    condition: When the host-protected session is not bound or the carrier throws.
    failure: Block the product shell and render the actual unavailable posture with retry.
    relations:
      - type: applies_to
        target: definition.overtone.failure.reason-code
  - id: rule.overtone.failure.r002
    kind: rule
    title: No unavailable feature submission
    modality: must_not
    statement: Submit music generation, music iteration, or Realm publish when its App Access operation is unavailable.
    condition: Until the corresponding operation is admitted and implemented through NimiLocalAppClient.
    failure: Keep the control disabled and expose the matching App Access unavailable definition.
    relations:
      - type: applies_to
        target: definition.overtone.failure.reason-music-app-access-unavailable
      - type: applies_to
        target: definition.overtone.failure.reason-realm-publish-unavailable
