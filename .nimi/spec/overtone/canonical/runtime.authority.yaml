format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.runtime
units:
  - id: definition.overtone.runtime.binding-f001
    kind: definition
    title: Runtime readiness binding
    meaning: Feature F-001 binds readiness to NimiLocalAppClient.auth.status and the portable App AIConfig projection, with ReadinessSnapshot as the expected output and no credit-consuming probe.
  - id: definition.overtone.runtime.binding-f002
    kind: definition
    title: Text generation binding
    meaning: Feature F-002 binds text assistance to NimiLocalAppClient.ai.text.generateCandidate with bounded system and user messages, with SongBrief fields and LyricsDocument.text as expected outputs.
  - id: definition.overtone.runtime.binding-f003
    kind: definition
    title: Music generation binding
    meaning: Feature F-003 is unavailable because the current protected Nimi Local App AI scenario contract does not admit a music-generation job type; no alternate Runtime transport is permitted.
  - id: definition.overtone.runtime.binding-f005
    kind: definition
    title: Music iteration binding
    meaning: Feature F-005 is unavailable while music generation is absent from the protected Nimi Local App contract; extend, remix, and reference inputs dispatch no Runtime operation.
  - id: definition.overtone.runtime.binding-f007
    kind: definition
    title: Realm media binding
    meaning: Feature F-007 is unavailable because the current protected Nimi Local App Realm contract does not expose media resource upload or post creation for Overtone.
  - id: definition.overtone.runtime.binding-f008
    kind: definition
    title: Image generation binding
    meaning: Feature F-008 may bind only to NimiLocalAppClient.ai.scenario.execute with an admitted image-generate spec and remains optional.
  - id: definition.overtone.runtime.binding-f009
    kind: definition
    title: Speech synthesis binding
    meaning: Feature F-009 may bind only to NimiLocalAppClient.ai.scenarioJobs and voiceAssets with admitted speech-synthesize inputs and remains optional.
  - id: definition.overtone.runtime.account-caller
    kind: definition
    title: Protected Local App carrier identity
    meaning: The Overtone carrier identity is app_id nimi.overtone bound by Nimi Desktop to the canonical project root and Electron process; Desktop and Runtime own all caller, session, proof, and credential material, and the renderer receives none of it.
  - id: rule.overtone.runtime.r001
    kind: rule
    title: App-scoped runtime entry
    modality: must
    statement: Obtain protected platform access through one NimiLocalAppClient created from the Kit host-injected standard shell surface, without constructing a generic Runtime client.
    condition: When the renderer obtains runtime access.
    failure: Fail client bootstrap and expose a typed runtime-unavailable state rather than constructing a private or legacy client.
    relations:
      - type: applies_to
        target: definition.overtone.runtime.account-caller
      - type: applies_to
        target: definition.overtone.runtime.binding-f001
  - id: rule.overtone.runtime.r002
    kind: rule
    title: Protected text candidate binding
    modality: must
    statement: Run brief and lyrics assistance through NimiLocalAppClient.ai.text.generateCandidate using bounded system and user messages plus optional temperature and maxTokens; derive availability from App AIConfig without reading or inventing connector or model identifiers.
    condition: When brief or lyrics assistance is dispatched.
    failure: Withhold dispatch and surface a typed text-capability unavailable or not-configured state.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.lyrics-document
      - type: applies_to
        target: definition.overtone.data-model.readiness-snapshot
      - type: applies_to
        target: definition.overtone.data-model.song-brief
      - type: applies_to
        target: definition.overtone.runtime.binding-f002
  - id: rule.overtone.runtime.r003
    kind: rule
    title: Music scenario admission gap
    modality: must_not
    statement: Submit music generation through a generic Runtime client, private SDK surface, raw IPC, or an unsupported Local App scenario discriminator while the protected Nimi Local App contract lacks music generation.
    condition: When submitting music generation.
    failure: Dispatch no job and render the explicit App Access unavailable state.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.generation-job
      - type: applies_to
        target: definition.overtone.runtime.binding-f003
  - id: rule.overtone.runtime.r004
    kind: rule
    title: No shadow music job lifecycle
    modality: must_not
    statement: Create a renderer-owned submit, poll, subscribe, terminal lookup, artifact fetch, or pseudo-job lifecycle for unavailable music generation.
    condition: While music generation is absent from the protected Local App contract.
    failure: Keep activeJobs empty and create no SongTake or TakeArtifact.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.generation-job
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
      - type: applies_to
        target: definition.overtone.runtime.binding-f003
  - id: rule.overtone.runtime.r005
    kind: rule
    title: Iteration admission gap
    modality: must_not
    statement: Serialize or dispatch reference-audio, extend, remix, or style-reference music iteration through a generic Runtime request while music jobs are not admitted for Local Apps.
    condition: When constructing or displaying a music iteration request.
    failure: Dispatch nothing and display the explicit App Access unavailable state.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.runtime.binding-f005
  - id: rule.overtone.runtime.r006
    kind: rule
    title: Credit-free readiness probes
    modality: must
    statement: Probe session posture with NimiLocalAppClient.auth.status and read text capability intent from NimiLocalAppClient.aiConfig.get; never submit a generation request, read connector or model custody, or infer unavailable music support.
    condition: When computing runtime readiness.
    failure: Return a typed unavailable or not-configured readiness projection and dispatch no probe generation.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.readiness-snapshot
      - type: applies_to
        target: definition.overtone.runtime.binding-f001
  - id: rule.overtone.runtime.r007
    kind: rule
    title: Optional P1 protected scenarios
    modality: must_not
    statement: Use an execution surface other than NimiLocalAppClient.ai.scenario or scenarioJobs for optional image and speech work, or make either optional surface gate the base workspace.
    condition: When P1 cover-art or guide-vocal generation is offered.
    failure: Keep the P1 surface unavailable on failure while leaving the P0 creation loop operational.
    relations:
      - type: applies_to
        target: definition.overtone.runtime.binding-f008
      - type: applies_to
        target: definition.overtone.runtime.binding-f009
  - id: rule.overtone.runtime.r008
    kind: rule
    title: Experimental voice assets
    modality: must_not
    statement: Use a surface other than NimiLocalAppClient.ai.scenarioJobs and voiceAssets for admitted experimental voice work, or require any base or optional feature to depend on voice clone or voice design.
    condition: When P2 voice clone or voice design experimentation is offered.
    failure: Keep the experimental surface unavailable on failure and preserve every P0 and P1 path.
    relations:
      - type: applies_to
        target: definition.overtone.product.feature-f010
  - id: rule.overtone.runtime.r009
    kind: rule
    title: Reason-code propagation
    modality: must
    statement: Propagate protected session and admitted App Access reason codes to the user through the admitted reason mapping, without swallowing, rewriting, or coercing them into a generic message.
    condition: When the Local App carrier or an admitted App Access operation returns a reason code.
    failure: Display the mapped user-readable reason and recovery hint while retaining the original reason-code identity.
    relations:
      - type: applies_to
        target: definition.overtone.failure.reason-code
  - id: rule.overtone.runtime.r010
    kind: rule
    title: Forbidden runtime patterns
    modality: must_not
    statement: Call runtime.account methods; read runtime/internal/**; construct a generic Runtime transport; treat an unbound Local App session as ready; or submit any unsupported music scenario through App Access.
    condition: Always.
    failure: Fail closed at the call site, dispatch no forbidden runtime operation, and surface the applicable typed failure.
    relations:
      - type: applies_to
        target: definition.overtone.runtime.account-caller
      - type: applies_to
        target: definition.overtone.runtime.binding-f001
      - type: applies_to
        target: definition.overtone.runtime.binding-f003
