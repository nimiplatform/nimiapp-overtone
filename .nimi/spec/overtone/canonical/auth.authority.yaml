format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.auth
units:
  - id: definition.overtone.auth.runtime-account-session
    kind: definition
    title: Protected Local App session
    meaning: The Overtone session is the Desktop-supervised protected Local App session exposed through NimiLocalAppClient.auth.status; Desktop and Runtime own process binding and credential custody, while the renderer receives only bounded session posture.
  - id: rule.overtone.auth.r001
    kind: rule
    title: Exact host session posture
    modality: must
    statement: Consume the exact session posture returned by NimiLocalAppClient.auth.status and treat only sessionBound true as ready without constructing or submitting a renderer-owned caller identity.
    condition: When resolving application session readiness.
    failure: Keep the app gate blocked and surface the returned reason code when the protected session is not bound.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
      - type: applies_to
        target: definition.overtone.runtime.account-caller
  - id: rule.overtone.auth.r002
    kind: rule
    title: SDK Local App construction
    modality: must
    statement: Construct one NimiLocalAppClient through createNimiClient with createNimiLocalAppStandardShellSurface only in the shell auth boundary and reuse that client for protected App Access operations.
    condition: When bootstrapping the protected Local App session.
    failure: Fail bootstrap and expose a typed unavailable state without constructing a direct Runtime client or bearer-token transport.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
      - type: applies_to
        target: definition.overtone.runtime.account-caller
  - id: rule.overtone.auth.r003
    kind: rule
    title: No app token custody
    modality: must_not
    statement: Give the renderer or Electron shell custody of access tokens, refresh tokens, subject-user-id providers, session stores, session cookies, OAuth codes, caller identity material, or launch proof; place protected material in renderer state or environment variables; or bypass the host-injected Local App surface.
    condition: Always.
    failure: Fail closed at the SDK helper, auth adapter, renderer-state, or environment boundary and retain token material solely in Runtime.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
  - id: rule.overtone.auth.r004
    kind: rule
    title: Desktop-owned session establishment
    modality: must_not
    statement: Implement login, account registration, OAuth completion, or session establishment inside Overtone; the user establishes account and development posture in Nimi Desktop before running the official app command.
    condition: When the protected Local App session is unavailable.
    failure: Keep the app gate blocked and direct recovery to Nimi Desktop without exposing an in-app credential surface.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
      - type: applies_to
        target: definition.overtone.runtime.account-caller
  - id: rule.overtone.auth.r005
    kind: rule
    title: Local App session status
    modality: must
    statement: Resolve session status through NimiLocalAppClient.auth.status; treat sessionBound true as ready and every other state as unavailable or action-required without inferring authentication from cached state, environment overrides, or an absent error.
    condition: When resolving Local App session status.
    failure: Project the typed unavailable posture whenever the host does not return an exact bound session.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
  - id: rule.overtone.auth.r006
    kind: rule
    title: No first-party account controls
    modality: must_not
    statement: Call runtime.account methods, load or save a shared auth session, expose account switching or logout, or register any app-owned auth IPC handler.
    condition: Always.
    failure: Fail closed at the call or registration boundary and expose no first-party control, raw token, shared-session bridge, or IPC handler.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
  - id: rule.overtone.auth.r007
    kind: rule
    title: No standalone auth bypass
    modality: must_not
    statement: Enable standalone auth modes, consume developer-session environment credentials, synthesize session credentials, launch Electron directly, or self-open registration; local development must enter through pnpm dev and the Desktop supervisor.
    condition: During local development or session bootstrap.
    failure: Reject the bypass, keep the session unavailable, and require the official Desktop-supervised launch path.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
      - type: applies_to
        target: definition.overtone.runtime.account-caller
  - id: rule.overtone.auth.r008
    kind: rule
    title: No app-owned login UI
    modality: must_not
    statement: Build a login form, OTP code-entry surface, password-reset surface, or embedded browser authorization surface inside Overtone.
    condition: Always.
    failure: Fail UI validation and render only the typed Local App unavailable state with Desktop recovery guidance.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
