format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.auth
units:
  - id: definition.overtone.auth.runtime-account-session
    kind: definition
    title: Nimi App session
    meaning: Overtone uses the verified Nimi App session from the shared Kit Desktop or Web factory. Desktop and Runtime own native process binding; the admitted Web source uses official Nimi login and direct Runtime access. The App observes bounded identity and connection scopes and owns no alternative account authority.
  - id: rule.overtone.auth.r001
    kind: rule
    title: Verified identity and connected scope
    modality: must
    statement: Consume the shared Kit session snapshot; expose private workspace state only for its verified identity and execute Nimi operations only through the captured connected scope. A connection loss retains same-identity draft state but prevents new operations; identity loss or account change clears private workspace state.
    condition: When resolving application session readiness.
    failure: Show the shared account or connection recovery action without inferring permission from cached UI state.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
      - type: applies_to
        target: definition.overtone.runtime.account-caller
  - id: rule.overtone.auth.r002
    kind: rule
    title: Shared Kit session construction
    modality: must
    statement: Construct the platform session through createDesktopNimiAppSession or createWebNimiAppSession at the entry and provide its captured common NimiAppRuntimeClient to product consumers. Reuse Kit account controls and access gates instead of implementing OAuth, session polling or native proof in the App.
    condition: When bootstrapping Desktop or the declared Web source.
    failure: Fail bootstrap and expose a typed unavailable state without constructing a direct Runtime client or bearer-token transport.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
      - type: applies_to
        target: definition.overtone.runtime.account-caller
  - id: rule.overtone.auth.r003
    kind: rule
    title: No app token custody
    modality: must_not
    statement: Implement App-owned custody of Nimi account credentials, refresh tokens, caller identity or native launch proof, or bypass the SDK/Kit identity and Runtime admission boundaries. The Web factory alone handles its scoped login transaction; product state contains no credential material.
    condition: Always.
    failure: Reject the bypass and keep credential ownership in the admitted platform implementation.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
  - id: rule.overtone.auth.r004
    kind: rule
    title: Platform-owned session establishment
    modality: must_not
    statement: Implement independent Nimi login, account registration or OAuth completion inside Overtone. Desktop account management stays in Home; Web starts the official login through Kit and returns to its exact registered source.
    condition: When Nimi identity or Runtime access is unavailable.
    failure: Keep protected operations unavailable and show the appropriate shared Kit recovery action.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
      - type: applies_to
        target: definition.overtone.runtime.account-caller
  - id: rule.overtone.auth.r005
    kind: rule
    title: Current session posture
    modality: must
    statement: Observe current identity and connection state through Kit rather than caching one successful startup check. A valid identity alone does not grant Runtime operations; reconnect establishes a new technical scope and never resubmits a business task.
    condition: When rendering or resuming a Nimi session.
    failure: Discard stale scope results and show the actual unavailable state.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
  - id: rule.overtone.auth.r006
    kind: rule
    title: No first-party account authority
    modality: must_not
    statement: Call runtime.account methods, load or save Home account credentials, or register an App-owned auth IPC handler. Desktop delegates account management to Home; Web may end or switch only its own scoped Kit App session.
    condition: Always.
    failure: Expose no first-party credential or account-management authority to the App.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
  - id: rule.overtone.auth.r007
    kind: rule
    title: Admitted platform entry
    modality: must_not
    statement: Consume developer credentials, fabricate session or process proof, launch native Electron outside Desktop supervision, or self-approve a source. Desktop development uses the official supervised command; Web uses its declared HTTPS entry, source admission and first Home confirmation.
    condition: During local development or session bootstrap.
    failure: Keep the unsupported entry unavailable without borrowing another App identity or bypassing approval.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
      - type: applies_to
        target: definition.overtone.runtime.account-caller
  - id: rule.overtone.auth.r008
    kind: rule
    title: No app-owned login UI
    modality: must_not
    statement: Build a login form, OTP code-entry surface, password-reset surface, or embedded browser authorization surface inside Overtone.
    condition: Always.
    failure: Use the shared Kit account action and official page; never collect Nimi credentials in App-owned forms.
    relations:
      - type: applies_to
        target: definition.overtone.auth.runtime-account-session
