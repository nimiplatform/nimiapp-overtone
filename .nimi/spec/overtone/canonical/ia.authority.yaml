format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.ia
units:
  - id: definition.overtone.ia.single-workspace
    kind: definition
    title: Single workspace
    meaning: Exactly one active SongProject per app instance; opening the protected app enters an existing draft or a blank interactive playground, and one New Exploration action resets the session with confirmation when work exists.
  - id: definition.overtone.ia.three-zone-layout
    kind: definition
    title: Three-zone layout
    meaning: One music playground with a spacious Compose stage for idea, two-axis intent, AI proposals and draft editing; an adjacent Output shelf for recordings and direct A/B audition; and a compact Transport footer. Narrow windows reflow the same content without extra project navigation.
  - id: rule.overtone.ia.r001
    kind: rule
    title: Exactly three zones
    modality: must
    statement: Render a creation stage, an always-reachable recording shelf and a transport footer; give AI proposals the creation stage and keep existing recordings independently reachable during exploration. Reflow for narrow windows without introducing a separate project navigation system.
    condition: When the authenticated workspace is rendered.
    failure: Fail layout validation and omit any fourth primary zone.
    relations:
      - type: applies_to
        target: definition.overtone.ia.three-zone-layout
  - id: rule.overtone.ia.r002
    kind: rule
    title: Direct creative entry
    modality: must
    statement: After protected session readiness, restore the local draft or initialize one blank app-owned SongProject directly in the interactive playground; show a clear idea input and authored sparks, with actual capability readiness and no credit-consuming automatic generation.
    condition: When initializing the protected workspace.
    failure: Render the visible typed indicator with the applicable state and keep only unavailable capability actions disabled; manual brief and local editing may still start.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.readiness-snapshot
      - type: applies_to
        target: definition.overtone.ia.single-workspace
  - id: rule.overtone.ia.r003
    kind: rule
    title: Progressive creative detail
    modality: must
    statement: Lead with the idea and visual intent controls, allow browsing the three AI proposals in the same stage, and reveal editable sound notes and lyrics when requested. Keep the generation target and explicit generation action adjacent; text reinterpretation uses only a selected take snapshot.
    condition: When rendering the Compose zone.
    failure: Reject layouts that hide the active generation target or its prerequisites, expose unsupported iteration, or add separate project navigation.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.ia.three-zone-layout
  - id: rule.overtone.ia.r004
    kind: rule
    title: Reverse-chronological take list
    modality: must
    statement: Render Output takes newest first, with each entry showing editable title, origin badge, mini waveform when decoded, selection bound to selectedTakeId, favorite and discard affordances, and A/B compare-slot affordances.
    condition: When the Output zone contains takes.
    failure: Do not present an incomplete or incorrectly ordered take entry; render a typed unavailable artifact affordance where decoded waveform data is absent.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-project
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.ia.three-zone-layout
  - id: rule.overtone.ia.r005
    kind: rule
    title: Non-destructive compare overlay
    modality: must
    statement: When both comparedTakeIds slots are populated, any rendered A/B overlay preserves and does not hide the underlying take list and remains dismissible without state loss.
    condition: When both A/B comparison slots are populated and the overlay is rendered.
    failure: Dismiss the invalid overlay and restore the unchanged take list and comparison state.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-project
      - type: applies_to
        target: definition.overtone.ia.three-zone-layout
  - id: rule.overtone.ia.r006
    kind: rule
    title: Selected-take transport
    modality: must
    statement: Render Transport with play and pause bound to the selected take's decoded buffer, current time and duration in m:ss / m:ss form, and a clickable waveform that seeks within the selected take; admit adjacent P0 set-in, set-out, and clear trim controls, but no advanced multi-region trims. Start each selected take with its own trim bounds, keep trim labels legible on the transport surface, and lay transport outside the narrow-window content scroller so focused controls remain visible.
    condition: When the Transport zone is rendered for a selected take.
    failure: Disable unavailable playback or seek controls with a typed artifact state and omit out-of-scope trim controls.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
      - type: applies_to
        target: definition.overtone.ia.three-zone-layout
  - id: rule.overtone.ia.r007
    kind: rule
    title: Unavailable publication has no action surface
    modality: must
    statement: Omit publication actions, forms and completion copy while the protected Realm publication operation is unavailable; expose working audio export instead.
    condition: While the protected Realm publication operation is unavailable.
    failure: Expose no publication UI or publish request.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.ia.three-zone-layout
      - type: applies_to
        target: definition.overtone.realm.publish-surface
  - id: rule.overtone.ia.r008
    kind: rule
    title: Single session without project navigation
    modality: must_not
    statement: Introduce multi-project navigation, saved-session rails, project pickers or a parallel app shell. Local choices between AI proposals, settings disclosures and draft detail are in-place interactions within the single workspace.
    condition: Always.
    failure: Fail layout validation and keep the parallel navigation primitive unavailable.
    relations:
      - type: applies_to
        target: definition.overtone.ia.single-workspace
      - type: applies_to
        target: definition.overtone.ia.three-zone-layout
  - id: rule.overtone.ia.r009
    kind: rule
    title: Actionable readiness banner
    modality: must
    statement: Show neutral checking feedback while probing; show a warning only when a completed protected probe proves the text or music capability is unconfigured. Keep recovery local to the affected task and preserve typed error details.
    condition: While protected readiness is checking or a completed probe reports an unconfigured text or music capability.
    failure: Keep the affected action disabled and display the actionable typed readiness banner.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.readiness-snapshot
      - type: applies_to
        target: definition.overtone.ia.three-zone-layout
  - id: rule.overtone.ia.r010
    kind: rule
    title: Keyboard affordances
    modality: must
    statement: Bind Space to playback, Left and Right to five-second seek, Shift plus arrows to fifteen-second seek, Escape to dismiss the active dialog or exit compare, and Control-N or Command-N to confirmed project reset. Editable controls retain their own key behavior.
    condition: When an admitted keyboard affordance is handled.
    failure: Ignore conflicting bindings, preserve current state, and expose only the admitted action for the key.
    relations:
      - type: applies_to
        target: definition.overtone.ia.single-workspace
      - type: applies_to
        target: definition.overtone.ia.three-zone-layout
