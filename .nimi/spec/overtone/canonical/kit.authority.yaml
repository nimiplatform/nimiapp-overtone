format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.kit
units:
  - id: definition.overtone.kit.allowlist
    kind: definition
    title: Kit module allowlist
    meaning: The admitted @nimiplatform/kit imports are ui, ui styles, light and nimi accent themes, core offline coordinator, shell renderer bridge and bootstrap, and shell Electron main and preload-cjs.
  - id: rule.overtone.kit.r001
    kind: rule
    title: Kit-first UI
    modality: must
    statement: Consume the @nimiplatform/kit export for every covered UI primitive, surface, or pattern rather than building an app-local equivalent, and limit app-local code to Overtone-specific composition and product behavior.
    condition: When implementing UI already covered by Kit.
    failure: Fail UI review and replace the duplicate local surface with the admitted Kit export.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r002
    kind: rule
    title: Allowlisted entry points
    modality: must_not
    statement: Import from any @nimiplatform/kit submodule outside the admitted Kit module allowlist.
    condition: Always.
    failure: Fail import-boundary validation and block the unlisted module import.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r003
    kind: rule
    title: Nimi accent with Overtone product tokens
    modality: must
    statement: Initialize NimiThemeProvider with accentPack equal to nimi-accent, import Kit UI, light-theme, and nimi-accent styles, and express Overtone branding only through bounded app-owned product variables and layout CSS.
    condition: When initializing renderer theme and styles.
    failure: Fail theme validation and render only after the admitted Kit base and bounded Overtone product styles are active.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r004
    kind: rule
    title: Protected Local App shell
    modality: must
    statement: Install the Kit standard renderer bridge before constructing NimiLocalAppClient, register the protected Electron bridge and asset media platform in the Electron main process, and render no app-owned login or token surface.
    condition: When bootstrapping the renderer or Electron carrier.
    failure: Fail bootstrap and expose the typed host-unavailable state without constructing a direct Runtime, login, or bearer-token path.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r005
    kind: rule
    title: Music lifecycle unavailable
    modality: must_not
    statement: Import or invoke the retired generic RuntimeGenerationPanel lifecycle, submit a music scenario job, or synthesize a successful music artifact while the Local App App Access surface does not admit music jobs.
    condition: Until an authoritative Local App music operation is admitted.
    failure: Keep generation and iteration disabled and render the typed App Access unavailable explanation.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r006
    kind: rule
    title: Shared UI primitives
    modality: must
    statement: Use Surface for panel containers, OverlayShell for publish, StatusBadge for status and readiness, InlineAlert for typed warnings, and Kit controls for their covered interactions without parallel button, badge, overlay, or surface implementations.
    condition: When rendering the corresponding workspace UI.
    failure: Fail UI review and replace the duplicate primitive with the admitted Kit component.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r007
    kind: rule
    title: Bounded local CSS
    modality: must_not
    statement: Fork Kit component behavior, accessibility, focus management, material surfaces, or general design tokens through app-local CSS; Overtone-specific layout, content treatment, and bounded brand-variable mapping remain app owned.
    condition: Always.
    failure: Fail style-boundary validation and remove the duplicate Kit behavior or general token override.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r008
    kind: rule
    title: Canonical workspace Kit
    modality: must
    statement: Consume the canonical workspace-linked @nimiplatform/kit package and update package.json plus pnpm-lock.yaml together when its dependency declaration changes; never vendor or inline a fork.
    condition: When consuming or changing the Kit dependency.
    failure: Fail dependency validation and block the divergent Kit source or incomplete lockfile update.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r009
    kind: rule
    title: No DOM tunneling
    modality: must_not
    statement: Wrap Kit components in dangerouslySetInnerHTML, portal tunneling, or runtime-mutating wrappers to bypass accessibility, focus management, or theming; extend Kit only through documented props and slot APIs.
    condition: Always.
    failure: Fail UI validation and remove the bypass wrapper before rendering the component.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
