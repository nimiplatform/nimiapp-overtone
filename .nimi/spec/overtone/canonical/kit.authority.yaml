format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.kit
units:
  - id: definition.overtone.kit.allowlist
    kind: definition
    title: Kit module allowlist
    meaning: The admitted @nimiplatform/kit imports are ui, ui styles, light and nimi accent themes, core offline coordinator, shell renderer bridge and bootstrap, shell Electron main and preload-cjs, features model-config, and features generation runtime.
  - id: rule.overtone.kit.r001
    kind: rule
    title: Kit-first UI
    modality: must
    statement: Consume the @nimiplatform/kit export for every covered UI primitive, surface, or pattern rather than building an app-local equivalent, and limit app-local code to Overtone-specific composition and product behavior.
    condition: When implementing UI already covered by Kit.
    failure: Fail UI review and replace the duplicate local surface with the admitted Kit export.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r002
    kind: rule
    title: Allowlisted entry points
    modality: must_not
    statement: Import from any @nimiplatform/kit submodule outside the admitted Kit module allowlist.
    condition: Always.
    failure: Fail import-boundary validation and block the unlisted module import.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r003
    kind: rule
    title: Overtone visual system on Kit
    modality: must
    statement: Initialize NimiThemeProvider with the Kit base and allow the user-authorized Overtone visual system to define its own palette, typography, flat materials and composition through app-owned CSS and theme slots; preserve Kit accessibility and protected shell behavior.
    condition: When initializing renderer theme and styles.
    failure: Fail theme validation and render only after the admitted Kit base and bounded Overtone product styles are active.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r004
    kind: rule
    title: Protected Local App shell
    modality: must
    statement: Install the Kit standard renderer bridge before constructing NimiLocalAppClient, register the protected Electron bridge and asset media platform in the Electron main process, and render no app-owned login or token surface.
    condition: When bootstrapping the renderer or Electron carrier.
    failure: Fail bootstrap and expose the typed host-unavailable state without constructing a direct Runtime, login, or bearer-token path.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r005
    kind: rule
    title: Shared music lifecycle
    modality: must_not
    statement: Import or invoke the retired generic RuntimeGenerationPanel lifecycle or synthesize a successful music artifact outside the protected Local App adapter and Kit music runner.
    condition: Whenever music generation is offered.
    failure: Withhold the unsupported invocation and display its typed failure.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r006
    kind: rule
    title: Shared UI primitives
    modality: must
    statement: Use Kit fields, buttons, dialogs, alerts and accessible interactions within the admitted Overtone visual system. Do not keep an unavailable publication form as a placeholder.
    condition: When rendering the corresponding workspace UI.
    failure: Fail UI review and replace the duplicate primitive with the admitted Kit component.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r007
    kind: rule
    title: App-owned presentation with shared behavior
    modality: must_not
    statement: Fork Kit accessibility, focus management or platform behavior; leave product CSS outside the style gate, exceed 48 KiB of UTF-8 product CSS under src/overtone, target private Kit classes, or style unscoped native controls. The admitted Overtone visual system may redefine app tokens, layout and content treatment.
    condition: Always.
    failure: Fail style-boundary validation and remove the duplicate Kit behavior or general token override.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r008
    kind: rule
    title: Public Kit and SDK dependencies
    modality: must
    statement: Consume published registry @nimiplatform/kit and SDK exports and keep package declarations and lockfile aligned. Do not introduce app-level workspace overrides, local cohort links, local package tarballs or vendored forks; retain the official production preflight and use a matching published App Tools cohort for release.
    condition: When consuming or changing the Kit dependency.
    failure: Fail dependency validation and block the divergent Kit source or incomplete lockfile update.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
  - id: rule.overtone.kit.r009
    kind: rule
    title: No DOM tunneling
    modality: must_not
    statement: Wrap Kit components in dangerouslySetInnerHTML, portal tunneling, or runtime-mutating wrappers to bypass accessibility, focus management, or theming; extend Kit only through documented props and slot APIs.
    condition: Always.
    failure: Fail UI validation and remove the bypass wrapper before rendering the component.
    relations:
      - type: applies_to
        target: definition.overtone.kit.allowlist
