format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.workflow
units:
  - id: definition.overtone.workflow.iteration-loop
    kind: definition
    title: Creation iteration loop
    meaning: Explore a scene or emotion through AI-proposed musical directions, explicitly choose and edit a brief and lyrics, generate audible takes, listen and compare, and create new interpretations from take text. Realm publication remains separately gated.
  - id: rule.overtone.workflow.r001
    kind: rule
    title: Readiness gate
    modality: must
    statement: Resolve readiness from the protected Local App session and App AIConfig. An unavailable session shows explanation and retry. A ready session enables manual creation and separately gates text and music by their configured capability contracts; Realm publication remains unavailable until admitted.
    condition: Before the workspace becomes interactive and on every readiness retry.
    failure: Keep interaction or music generation disabled as applicable and display the typed unavailable or readiness warning state.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.readiness-snapshot
      - type: applies_to
        target: definition.overtone.workflow.iteration-loop
  - id: rule.overtone.workflow.r002
    kind: rule
    title: Exploration before generation
    modality: must
    statement: Accept an idea with optional AI direction proposals, explicitly apply or manually author a brief and lyrics, and generate only after those inputs and music intent are ready. Comparing existing audio and editing drafts do not depend on new generation. Reference-audio transformations and Realm publication remain unavailable on the current contract.
    condition: Always.
    failure: Block the out-of-order stage or invalid iteration entry and keep the user at the first unmet prerequisite.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-brief
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.workflow.iteration-loop
  - id: rule.overtone.workflow.r003
    kind: rule
    title: Manual edits win
    modality: must
    statement: Preserve manual edits to SongBrief fields and LyricsDocument.text over regenerated assistant output, require explicit user action to regenerate a field, and never auto-overwrite a manually edited field after regeneration from a sibling field.
    condition: When assistant regeneration could affect manually edited content.
    failure: Retain the manual value and require an explicit regeneration action before replacing it.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.lyrics-document
      - type: applies_to
        target: definition.overtone.data-model.song-brief
      - type: applies_to
        target: definition.overtone.workflow.iteration-loop
  - id: rule.overtone.workflow.r004
    kind: rule
    title: Music generation from the author draft
    modality: must
    statement: Require a brief, lyrics, and the App music intent before explicit submission; compose the prompt from the brief and optional style tags and create a new take only from completed and decoded Runtime audio.
    condition: When the author requests a new generated take.
    failure: Preserve the author draft, show the missing configuration or typed execution failure, and create no substitute take.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.generation-job
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.workflow.iteration-loop
  - id: rule.overtone.workflow.r005
    kind: rule
    title: No pseudo job lifecycle
    modality: must_not
    statement: Invent job progress or successful SongTake output, or duplicate the SDK and Kit music job lifecycle in renderer code.
    condition: During music generation.
    failure: Keep activeJobs empty and withhold all take and artifact output.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.generation-job
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
      - type: applies_to
        target: definition.overtone.workflow.iteration-loop
  - id: rule.overtone.workflow.r006
    kind: rule
    title: Music iteration unavailable
    modality: must_not
    statement: Enable or dispatch extend, remix, or reference iteration while those inputs are absent from the protected Local App music contract.
    condition: While the iteration input admission gap remains.
    failure: Render the explicit unavailable state and dispatch no request.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.workflow.iteration-loop
  - id: rule.overtone.workflow.r007
    kind: rule
    title: Take selection
    modality: must
    statement: Set selectedTakeId without modifying the take and derive playback and textual iteration sources from it.
    condition: When the author selects a take.
    failure: Reject selection that mutates the take or cannot establish the selectedTakeId, and retain the prior selection.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-project
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.workflow.iteration-loop
  - id: rule.overtone.workflow.r008
    kind: rule
    title: Transient compare state
    modality: must
    statement: Keep compare mode transient with two independent comparedTakeIds slots that may each be null, and clear both slots on exit without discarding or renaming any take.
    condition: When entering, using, or exiting A/B compare mode.
    failure: Restore a valid transient compare projection and preserve every take unchanged.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-project
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.workflow.iteration-loop
  - id: rule.overtone.workflow.r009
    kind: rule
    title: Publish gating
    modality: must
    statement: Hide publish actions and forms while protected Realm publication is unavailable. Offer actual original-audio and trimmed-WAV export as the supported output path.
    condition: When offering output actions.
    failure: Expose no unavailable publication action or Realm request; disable export until its required audio and trim are valid.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.readiness-snapshot
      - type: applies_to
        target: definition.overtone.data-model.song-project
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
      - type: applies_to
        target: definition.overtone.realm.publish-surface
      - type: applies_to
        target: definition.overtone.workflow.iteration-loop
  - id: rule.overtone.workflow.r010
    kind: rule
    title: No Realm publish bypass
    modality: must_not
    statement: Upload take audio or create a Realm post through raw HTTP, bearer tokens, generic Realm clients, or any surface outside an admitted protected Local App operation.
    condition: When the publish surface is shown or invoked.
    failure: Keep publish unavailable and create no upload or post.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
      - type: applies_to
        target: definition.overtone.realm.publish-surface
      - type: applies_to
        target: definition.overtone.workflow.iteration-loop
  - id: rule.overtone.workflow.r011
    kind: rule
    title: Project reset
    modality: must
    statement: New Exploration, after confirmation when work exists, clears the current SongProject, decoded audio buffers and owned job subscriptions and opens a fresh blank project in the same playground. Late results from the discarded project cannot populate the new one.
    condition: When the author confirms New Exploration.
    failure: Withhold the fresh project until the prior session state, buffers and owned subscriptions are cleared; ignore late results from that prior session.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.generation-job
      - type: applies_to
        target: definition.overtone.data-model.song-project
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
      - type: applies_to
        target: definition.overtone.workflow.iteration-loop
  - id: rule.overtone.workflow.r012
    kind: rule
    title: From audition to full song
    modality: must
    statement: Let the author lock a selected take's prompt and lyric snapshots into a separate app-owned FullSongDraft, choose a 90, 120, or 180 second generation target, request a complete six-to-eight-section lyrical arrangement through protected text generation, edit each section, and explicitly submit the visible song through the same protected music runner. Preserve the exploration draft, source audio, manual changes during asynchronous writing, and the complete writing draft across reloads. Record the source relationship as textual inspiration only, carry the chosen duration budget to Runtime, and show decoded actual duration; audio below 75 percent of the chosen target is kept and labeled a short result rather than successful full-song completion. Let both the source audition and its generated song versions return to the existing arrangement without replacing it; explicitly distinguish starting another song from an unrelated recording.
    condition: When completing a selected musical direction as a song.
    failure: Preserve both drafts and source takes, reject incomplete arrangements before rendering, show the real failure or short-result notice, and never loop, concatenate, fabricate, or claim melody-preserving continuation.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-project
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.workflow.iteration-loop
