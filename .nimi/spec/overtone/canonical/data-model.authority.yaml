format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.data-model
units:
  - id: definition.overtone.data-model.song-project
    kind: definition
    title: Song project
    meaning: The sole active renderer session record, containing a session-unique SDK client projectId, millisecond-epoch createdAt, nullable SongBrief brief, nullable LyricsDocument lyrics, append-only SongTake takes, nullable selectedTakeId, two nullable comparedTakeIds A/B slots, nullable PublishDraft draftPost, and ReadinessSnapshot readiness; closing it clears the record and decoded audio buffers from memory.
  - id: definition.overtone.data-model.song-brief
    kind: definition
    title: Song brief
    meaning: The structured prompt envelope containing a title of at most 80 characters that may be empty before assistant fill, free-text genre, free-text mood, free-text tempo accepting qualitative or BPM hints, and a canonical creative-direction description of at most 1500 characters.
  - id: definition.overtone.data-model.lyrics-document
    kind: definition
    title: Lyrics document
    meaning: The canonical lyrics record containing text that may include section labels, source equal to assistant, manual, or mixed, and a numeric updatedAt timestamp.
  - id: definition.overtone.data-model.song-take
    kind: definition
    title: Song take
    meaning: One generated audio candidate containing SDK client takeId; optional parentTakeId; cataloged origin; title of at most 80 characters; runtime jobId; completed audio artifactId, verified artifactMimeType, decoded artifactByteLength, and MIME-derived artifactFileExtension; optional sourceMimeType, trimStartSec, and trimEndSec; promptSnapshot; optional lyricsSnapshot and styleSnapshot; optional durationSeconds and instrumental; favorite and soft-discarded flags; and createdAt.
  - id: definition.overtone.data-model.take-artifact
    kind: definition
    title: Take artifact
    meaning: An in-memory projection of a runtime ScenarioArtifact containing takeId, artifactId, a verified non-empty mimeType, bytes as ArrayBuffer or null until the decoded copy lands, and decoded as AudioBuffer or null.
  - id: definition.overtone.data-model.generation-job
    kind: definition
    title: Generation job
    meaning: A transient runtime async-job projection containing jobId, status equal to pending, running, completed, failed, canceled, or timeout, optional human-readable runtime progressLabel, and optional errorMessage.
  - id: definition.overtone.data-model.publish-draft
    kind: definition
    title: Publish draft
    meaning: The selected-master Realm publish record containing takeId, title, description, string tags, sourceMode equal to prompt-only, uploaded-audio, or derived-take, and provenanceConfirmed.
  - id: definition.overtone.data-model.readiness-snapshot
    kind: definition
    title: Readiness snapshot
    meaning: A readiness-pass projection containing runtimeStatus equal to checking, ready, degraded, or unavailable; optional runtimeErrorMessage; textCapabilityAvailable and musicCapabilityAvailable; and realmConfigured and realmAuthenticated, without connector, model, grant, or caller custody.
  - id: definition.overtone.data-model.origin-prompt
    kind: definition
    title: Prompt origin
    meaning: The prompt origin denotes a take generated directly from brief, lyrics, and style with no parent take and no reference audio; parent_take_id_required is false, upload_required is false, and realm_publish_source_mode is prompt-only.
  - id: definition.overtone.data-model.origin-extend
    kind: definition
    title: Extend origin
    meaning: The extend origin denotes a take generated by extending an existing take with the same brief, lyrics, and style plus the extend extension payload; parent_take_id_required is true, upload_required is false, and realm_publish_source_mode is derived-take.
  - id: definition.overtone.data-model.origin-remix
    kind: definition
    title: Remix origin
    meaning: The remix origin denotes a take generated by reinterpreting an existing take with new style or arrangement controls; parent_take_id_required is true, upload_required is false, and realm_publish_source_mode is derived-take.
  - id: definition.overtone.data-model.origin-reference
    kind: definition
    title: Reference origin
    meaning: The reference origin denotes a take generated by feeding uploaded reference audio as a guide for fresh generation; parent_take_id_required is false, upload_required is true, and realm_publish_source_mode is uploaded-audio.
  - id: rule.overtone.data-model.r001
    kind: rule
    title: Song project shape
    modality: must
    statement: Maintain exactly one active SongProject with projectId, createdAt, brief, lyrics, append-only takes, selectedTakeId, two comparedTakeIds slots, draftPost, and readiness; clear the project and every decoded audio buffer when the project closes.
    condition: Always.
    failure: Reject an invalid project projection, and on close remove the entity and decoded buffers before returning to the empty state.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-project
  - id: rule.overtone.data-model.r002
    kind: rule
    title: Song brief shape
    modality: must
    statement: Represent SongBrief with title of at most 80 characters, free-text genre, mood, and tempo, and canonical description of at most 1500 characters; permit title to be empty only before assistant fill; preserve manual edits over assistant regeneration.
    condition: When creating or updating a SongBrief.
    failure: Reject the invalid field update and retain the last valid manually controlled brief.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-brief
  - id: rule.overtone.data-model.r003
    kind: rule
    title: Lyrics provenance
    modality: must
    statement: Represent LyricsDocument with canonical text, source limited to assistant, manual, or mixed, and updatedAt; on the first manual character change after assistant output, transition source from assistant to mixed.
    condition: When lyrics are created or manually edited.
    failure: Reject an invalid source value and expose the document with correct edit provenance.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.lyrics-document
  - id: rule.overtone.data-model.r004
    kind: rule
    title: Song take shape and origin
    modality: must
    statement: Represent every SongTake with the complete identity, lineage, cataloged origin, title, runtime job and verified artifact metadata, optional source and trim metadata, immutable prompt, lyrics, and style snapshots, optional request duration and instrumental flag, favorite and discarded flags, and createdAt; write origin only as prompt, extend, remix, or reference.
    condition: When creating or updating a SongTake.
    failure: Reject the take projection when a required field is absent or origin is outside the admitted catalog.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.origin-extend
      - type: applies_to
        target: definition.overtone.data-model.origin-prompt
      - type: applies_to
        target: definition.overtone.data-model.origin-reference
      - type: applies_to
        target: definition.overtone.data-model.origin-remix
      - type: applies_to
        target: definition.overtone.data-model.song-take
  - id: rule.overtone.data-model.r005
    kind: rule
    title: In-memory take artifact
    modality: must
    statement: Project each ScenarioArtifact to an in-memory TakeArtifact with takeId, artifactId, verified non-empty MIME type, nullable bytes, and nullable decoded buffer; never persist decoded audio outside the renderer session; clear buffers on take discard, project reset, and app close; fail before creating a SongTake when artifactId, an audio/* MIME type, or decoded bytes are missing.
    condition: When resolving a completed runtime artifact.
    failure: Withhold SongTake creation, clear affected transient buffers, and surface a typed artifact error.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
  - id: rule.overtone.data-model.r006
    kind: rule
    title: Append-only takes
    modality: must
    statement: Keep takes append-only within a session; permit favorite, rename, and soft discard only; preserve jobId, artifact identity, MIME and byte metadata, promptSnapshot, lyricsSnapshot, source trim metadata, and createdAt on every existing take.
    condition: When an existing take is updated.
    failure: Reject mutation of immutable take fields and retain the prior take record.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
  - id: rule.overtone.data-model.r007
    kind: rule
    title: Transient generation jobs
    modality: must
    statement: Represent GenerationJob with jobId, admitted status, optional progressLabel, and optional errorMessage as a transient projection that never replaces a SongTake; append a SongTake whenever a completed job produces an artifact.
    condition: When tracking or completing a generation job.
    failure: Keep the job transient and reject completed artifact projection until the corresponding take is created.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.generation-job
      - type: applies_to
        target: definition.overtone.data-model.song-take
  - id: rule.overtone.data-model.r008
    kind: rule
    title: Local persistence boundary
    modality: must
    statement: Confine local persistence to in-memory React state or localStorage keys under nimi.overtone:* for non-secret preferences and recoverable draft metadata, or to admitted protected Local App storage; never persist tokens, refresh tokens, subject user IDs, OAuth codes, session cookies, Runtime or Realm response mirrors, artifact bytes, decoded audio buffers, uploaded reference audio, or active job projections across restarts in localStorage, sessionStorage, or IndexedDB.
    condition: When application state is stored locally.
    failure: Reject the persistence write, remove prohibited retained data, and surface a typed storage-boundary error where the user action cannot complete.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.generation-job
      - type: applies_to
        target: definition.overtone.data-model.song-project
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
  - id: rule.overtone.data-model.r009
    kind: rule
    title: Publish draft provenance
    modality: must
    statement: Represent PublishDraft with takeId, title, description, string tags, admitted sourceMode, and provenanceConfirmed; keep invocation unavailable until protected Local App Realm media operations are admitted, then require provenanceConfirmed at the call site.
    condition: When preparing or initiating Realm publish.
    failure: Block upload and keep publish unavailable until provenance is explicitly confirmed.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.publish-draft
  - id: rule.overtone.data-model.r010
    kind: rule
    title: Fresh readiness projection
    modality: must
    statement: Represent ReadinessSnapshot with admitted session status, optional Runtime error, text and music capability availability, and Realm configuration and authentication; recompute it on every readiness pass from Local App session posture and App AIConfig without exposing or synthesizing connector, model, grant, or caller identifiers.
    condition: On every readiness pass.
    failure: Mark the affected capability unavailable or not configured and expose a typed readiness state without fabricated authority or binding material.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.readiness-snapshot
