format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.data-model
units:
  - id: definition.overtone.data-model.song-project
    kind: definition
    title: Song project
    meaning: One active App-owned music project with schemaVersion 2, projectId, createdAt, brief, lyrics, append-only audio versions, selected and compared version identifiers, score documents and current score selection, an optional FullSongDraft, and recoverable author operations captured before submission. Project JSON and referenced audio and score assets use protected App storage; Runtime execution and routing remain platform-owned.
  - id: definition.overtone.data-model.song-brief
    kind: definition
    title: Song brief
    meaning: The structured prompt envelope containing a title of at most 80 characters that may be empty before assistant fill, free-text genre, free-text mood, free-text tempo accepting qualitative or BPM hints, and a canonical creative-direction description of at most 1500 characters.
  - id: definition.overtone.data-model.lyrics-document
    kind: definition
    title: Lyrics document
    meaning: The canonical lyrics record containing text that may include section labels, source equal to assistant, manual, or mixed, and a numeric updatedAt timestamp.
  - id: definition.overtone.data-model.song-take
    kind: definition
    title: Song version
    meaning: One playable immutable audio version, represented by the App SongTake type, with a takeId, optional parentTakeId, title, owned canonical audio asset and measured audio facts, optional score document, author input snapshot, favorite and discarded flags and createdAt. Origin is a discriminated runtime-result with a real Job and capability, imported-recording with an original source asset, or local-render with a deterministic mix recipe; imported and locally rendered versions never invent a Runtime Job.
  - id: definition.overtone.data-model.take-artifact
    kind: definition
    title: Take artifact
    meaning: An owned canonical audio App asset with relativePath, verified MIME, size and digest, sample rate, channels, frame count and duration. Renderer playback and bounded format and waveform caches are keyed by this asset identity; cache bytes are transient and Runtime Job expiration does not delete adopted App media.
  - id: definition.overtone.data-model.generation-job
    kind: definition
    title: Generation job
    meaning: "A transient UI projection of Runtime jobId and status: pending for submitted or queued, then running, completed, failed, canceled or timeout; no fabricated percentage, unused progress fields or durable execution state."
  - id: definition.overtone.data-model.publish-draft
    kind: definition
    lifecycle: removed
    title: Publish draft
    reason: Removed from the unlaunched app because the protected audio-input or publication operation is unavailable; no speculative application state is retained.
  - id: definition.overtone.data-model.readiness-snapshot
    kind: definition
    title: Readiness snapshot
    meaning: A checking, ready or unavailable protected Local App session projection with optional actual error and configured text and music availability; checking is unknown, not a missing-capability claim.
  - id: definition.overtone.data-model.origin-prompt
    kind: definition
    title: Prompt origin
    meaning: Prompt-only musical lineage is an author input snapshot on a runtime-result version. A textual parent relationship never claims preservation of melody, voice, accompaniment or waveform samples. Score-conditioned lineage instead names the immutable input score document and requested conditioning mode.
  - id: definition.overtone.data-model.origin-extend
    kind: definition
    lifecycle: removed
    title: Extend origin
    reason: Removed from the unlaunched app because the protected audio-input or publication operation is unavailable; no speculative application state is retained.
  - id: definition.overtone.data-model.origin-remix
    kind: definition
    lifecycle: removed
    title: Remix origin
    reason: Removed from the unlaunched app because the protected audio-input or publication operation is unavailable; no speculative application state is retained.
  - id: definition.overtone.data-model.origin-reference
    kind: definition
    lifecycle: removed
    title: Reference origin
    reason: Removed from the unlaunched app because the protected audio-input or publication operation is unavailable; no speculative application state is retained.
  - id: rule.overtone.data-model.r001
    kind: rule
    title: Song project shape
    modality: must
    statement: Maintain exactly one active schemaVersion 2 SongProject with its writing inputs, append-only audio versions, score documents and recoverable author operations. Keep readiness and active execution status transient. Starting a new exploration changes the active project and releases playback caches; late results remain bound to their original project and cannot enter the new one.
    condition: Always.
    failure: Reject an invalid project projection; prevent prior project state or audio from entering the new blank playground after a confirmed reset.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-project
  - id: rule.overtone.data-model.r002
    kind: rule
    title: Song brief shape
    modality: must
    statement: Represent SongBrief with title of at most 80 characters, free-text genre, mood, and tempo, and canonical description of at most 1500 characters; permit title to be empty only before assistant fill; preserve manual edits over assistant regeneration.
    condition: When creating or updating a SongBrief.
    failure: Reject the invalid field update and retain the last valid manually controlled brief.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-brief
  - id: rule.overtone.data-model.r003
    kind: rule
    title: Lyrics provenance
    modality: must
    statement: Represent LyricsDocument with canonical text, source limited to assistant, manual, or mixed, and updatedAt; on the first manual character change after assistant output, transition source from assistant to mixed.
    condition: When lyrics are created or manually edited.
    failure: Reject an invalid source value and expose the document with correct edit provenance.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.lyrics-document
  - id: rule.overtone.data-model.r004
    kind: rule
    title: Version origin and owned media
    modality: must
    statement: Represent every audio version with its owned canonical audio asset, measured facts and discriminated origin. Runtime results require a real completed Job and capability; imported recordings require a preserved source asset; local renders require their actual source versions and deterministic recipe. Keep prompt-only, score-conditioned and audio-derived input lineage distinct and do not invent Jobs or AI provenance for local work.
    condition: When creating or updating a SongTake.
    failure: Reject the take projection when a required field is absent or origin is outside the admitted catalog.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.origin-prompt
      - type: applies_to
        target: definition.overtone.data-model.song-take
  - id: rule.overtone.data-model.r005
    kind: rule
    title: Owned audio playback and bounded cache
    modality: must
    statement: Adopt every required Runtime music artifact through the protected App client, verify returned digest, MIME and size against the completed result, and validate canonical audio facts and finite samples before adding a version. Read saved assets through admitted media or streamed range operations. Keep only format and waveform caches transient within 4 MiB, without a whole-song decoded PCM cache; use Kit bounded PCM frames for editing and its Worker for waveform and mixing, the admitted opaque App media URL for playback, and protected asset reveal to open a saved file location. Playback handle renewal preserves the current position and never invokes AI work. Browser playback decoding never defines editable frame coordinates. Cancel abandoned reads, bound each wait and media readiness to 30 seconds, and release Workers and handles on disposal; late canceled media never enters the cache.
    condition: When resolving or playing an owned audio version.
    failure: Withhold SongTake creation, clear affected transient buffers, and surface a typed artifact error.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
  - id: rule.overtone.data-model.r006
    kind: rule
    title: Append-only takes
    modality: must
    statement: Keep audio versions append-only, allowing rename, favorite and soft discard. Preserve origin, owned audio and score identity, source relationships, author input snapshot, measured media facts and createdAt. A new render, edit or mix creates a new version. Do not delete an asset still referenced by another version or score document.
    condition: When an existing take is updated.
    failure: Reject mutation of immutable take fields and retain the prior take record.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
  - id: rule.overtone.data-model.r007
    kind: rule
    title: Durable author intent and transient execution
    modality: must
    statement: Persist an author operation and clientSubmissionId with immutable input snapshots and target project before Submit, and persist the real jobId when received. Keep execution status transient. Recover only by original submission identity or Job observation without Submit or automatic regeneration. Adopt the complete typed output and atomically save version and score references before removing its pending operation. Deduplicate by real Job identity, preserve concurrent author edits, and retain results on their submitting project when cancellation races with completion.
    condition: When tracking or completing a generation job.
    failure: Keep the job transient and reject completed artifact projection until the corresponding take is created.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.generation-job
      - type: applies_to
        target: definition.overtone.data-model.song-take
  - id: rule.overtone.data-model.r008
    kind: rule
    title: Local persistence boundary
    modality: must
    statement: Persist project metadata through protected Local App JSON storage and source, canonical audio and score bytes through protected App assets. Browser storage may retain only non-secret language, theme, volume and similar device preferences, never project media, active Jobs or credentials. Track actual save completion, retain in-memory work on failure and allow explicit retry. SchemaVersion 2 hard-cuts the old workspace.v1 browser draft; an explicit one-time local backup and import tool may recover available author inputs and results, but no permanent dual-write or automatic migration path is admitted.
    condition: When application state is stored locally.
    failure: Reject the persistence write, remove prohibited retained data, and surface a typed storage-boundary error where the user action cannot complete.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.generation-job
      - type: applies_to
        target: definition.overtone.data-model.song-project
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
  - id: rule.overtone.data-model.r009
    kind: rule
    title: Publish draft provenance
    modality: must
    statement: Allocate no publish draft, provenance form or publication state while the protected Realm publish operation is unavailable.
    condition: When preparing or initiating Realm publish.
    failure: Expose no publication action, form or upload while the protected publication operation is unavailable.
    relations:
      - type: applies_to
        target: definition.overtone.realm.publish-surface
  - id: rule.overtone.data-model.r010
    kind: rule
    title: Fresh readiness projection
    modality: must
    statement: Compute protected session status and configured text and music availability afresh; checking shows neutral progress, and only a completed probe may report missing capabilities. Do not project unqueried Realm status as false facts.
    condition: On every readiness pass.
    failure: Mark the affected capability unavailable or not configured and expose a typed readiness state without fabricated authority or binding material.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.readiness-snapshot
