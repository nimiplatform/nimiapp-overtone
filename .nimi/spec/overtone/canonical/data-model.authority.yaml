format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.data-model
units:
  - id: definition.overtone.data-model.song-project
    kind: definition
    title: Song project
    meaning: One app-owned writing session with projectId, createdAt, brief, lyrics, takes, selectedTakeId, two comparedTakeIds, an optional FullSongDraft, and optional recoverableResults containing only author submission snapshots and references to completed Runtime jobs; execution and media bytes remain Runtime-owned, and cache contents never persist.
  - id: definition.overtone.data-model.song-brief
    kind: definition
    title: Song brief
    meaning: The structured prompt envelope containing a title of at most 80 characters that may be empty before assistant fill, free-text genre, free-text mood, free-text tempo accepting qualitative or BPM hints, and a canonical creative-direction description of at most 1500 characters.
  - id: definition.overtone.data-model.lyrics-document
    kind: definition
    title: Lyrics document
    meaning: The canonical lyrics record containing text that may include section labels, source equal to assistant, manual, or mixed, and a numeric updatedAt timestamp.
  - id: definition.overtone.data-model.song-take
    kind: definition
    title: Song take
    meaning: One verified playable music result with takeId, prompt origin, optional textual parentTakeId, title, Runtime jobId and audio artifactId, verified MIME and byte metadata, immutable prompt and lyric snapshots, actual decoded duration, requested duration and sketch or song intent, favorite and discarded flags, and createdAt.
  - id: definition.overtone.data-model.take-artifact
    kind: definition
    title: Take artifact
    meaning: A renderer-only media cache entry keyed by Runtime artifactId, containing verified MIME, original ArrayBuffer bytes, decoded AudioBuffer and compact waveform peaks; evicted audio may leave lightweight peaks, and the retained SongTake references the Runtime artifact.
  - id: definition.overtone.data-model.generation-job
    kind: definition
    title: Generation job
    meaning: "A transient UI projection of Runtime jobId and status: pending for submitted or queued, then running, completed, failed, canceled or timeout; no fabricated percentage, unused progress fields or durable execution state."
  - id: definition.overtone.data-model.publish-draft
    kind: definition
    lifecycle: removed
    title: Publish draft
    reason: Removed from the unlaunched app because the protected audio-input or publication operation is unavailable; no speculative application state is retained.
  - id: definition.overtone.data-model.readiness-snapshot
    kind: definition
    title: Readiness snapshot
    meaning: A checking, ready or unavailable protected Local App session projection with optional actual error and configured text and music availability; checking is unknown, not a missing-capability claim.
  - id: definition.overtone.data-model.origin-prompt
    kind: definition
    title: Prompt origin
    meaning: A take generated from prompt and lyrics with no reference audio. Optional parentTakeId records only the take whose text inspired the new interpretation; it never claims audio derivation. Realm source mode remains prompt-only.
  - id: definition.overtone.data-model.origin-extend
    kind: definition
    lifecycle: removed
    title: Extend origin
    reason: Removed from the unlaunched app because the protected audio-input or publication operation is unavailable; no speculative application state is retained.
  - id: definition.overtone.data-model.origin-remix
    kind: definition
    lifecycle: removed
    title: Remix origin
    reason: Removed from the unlaunched app because the protected audio-input or publication operation is unavailable; no speculative application state is retained.
  - id: definition.overtone.data-model.origin-reference
    kind: definition
    lifecycle: removed
    title: Reference origin
    reason: Removed from the unlaunched app because the protected audio-input or publication operation is unavailable; no speculative application state is retained.
  - id: rule.overtone.data-model.r001
    kind: rule
    title: Song project shape
    modality: must
    statement: Maintain exactly one active SongProject with projectId, createdAt, brief, lyrics, append-only takes, selectedTakeId, two comparedTakeIds slots, an optional FullSongDraft and recoverable completed-result references. Keep readiness outside the persisted writing draft and clear the prior project and decoded audio when starting a new exploration.
    condition: Always.
    failure: Reject an invalid project projection; prevent prior project state or audio from entering the new blank playground after a confirmed reset.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-project
  - id: rule.overtone.data-model.r002
    kind: rule
    title: Song brief shape
    modality: must
    statement: Represent SongBrief with title of at most 80 characters, free-text genre, mood, and tempo, and canonical description of at most 1500 characters; permit title to be empty only before assistant fill; preserve manual edits over assistant regeneration.
    condition: When creating or updating a SongBrief.
    failure: Reject the invalid field update and retain the last valid manually controlled brief.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-brief
  - id: rule.overtone.data-model.r003
    kind: rule
    title: Lyrics provenance
    modality: must
    statement: Represent LyricsDocument with canonical text, source limited to assistant, manual, or mixed, and updatedAt; on the first manual character change after assistant output, transition source from assistant to mixed.
    condition: When lyrics are created or manually edited.
    failure: Reject an invalid source value and expose the document with correct edit provenance.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.lyrics-document
  - id: rule.overtone.data-model.r004
    kind: rule
    title: Song take shape and origin
    modality: must
    statement: Represent generated takes with the documented playable-result metadata and origin prompt only. parentTakeId denotes textual inspiration, never audio transformation. Do not declare extend, remix or reference origins without an admitted implemented audio-input operation.
    condition: When creating or updating a SongTake.
    failure: Reject the take projection when a required field is absent or origin is outside the admitted catalog.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.origin-prompt
      - type: applies_to
        target: definition.overtone.data-model.song-take
  - id: rule.overtone.data-model.r005
    kind: rule
    title: In-memory take artifact
    modality: must
    statement: Read artifacts only through the protected client, verify bytes and MIME essence plus meaningful parameters, and decode before creating a playable take. Share decoded audio and compact waveform peaks in a renderer-only cache with a 256 MiB total resident audio budget and 128 MiB per-decoded-buffer bound, evict least-recently-used unpinned audio, and clear the cache on project reset and discard. Keep only the selected playback artifact pinned and keep lightweight peaks separate. Recover an unavailable result by querying and reading the same Runtime job and artifact, never by new generation. Coalesce media consumers per artifact, cancel abandoned queued reads, bound read waiting to 30 seconds, and keep browser decoding serial; late canceled media never enters the cache.
    condition: When resolving a completed runtime artifact.
    failure: Withhold SongTake creation, clear affected transient buffers, and surface a typed artifact error.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
  - id: rule.overtone.data-model.r006
    kind: rule
    title: Append-only takes
    modality: must
    statement: Keep takes append-only within a session; permit favorite, rename, and soft discard only; preserve jobId, artifact identity, MIME and byte metadata, promptSnapshot, lyricsSnapshot, source trim metadata, and createdAt on every existing take.
    condition: When an existing take is updated.
    failure: Reject mutation of immutable take fields and retain the prior take record.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
  - id: rule.overtone.data-model.r007
    kind: rule
    title: Transient generation jobs
    modality: must
    statement: Keep active job identity and status transient. Upon Runtime completion, preserve a recoverable reference and the author submission snapshot before artifact loading. Atomically replace this app-owned pending-import reference with one decoded take; repeated recovery of a job never duplicates a take. Bind the reference to its submitting app project so late completion cannot populate a different project. If cancellation races with a verified Runtime completion, retain that completed reference rather than discarding the already-generated result.
    condition: When tracking or completing a generation job.
    failure: Keep the job transient and reject completed artifact projection until the corresponding take is created.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.generation-job
      - type: applies_to
        target: definition.overtone.data-model.song-take
  - id: rule.overtone.data-model.r008
    kind: rule
    title: Local persistence boundary
    modality: must
    statement: Confine local persistence to in-memory React state or localStorage keys under nimi.overtone:* for non-secret preferences and recoverable draft metadata, or to admitted protected Local App storage; never persist tokens, refresh tokens, subject user IDs, OAuth codes, session cookies, Runtime or Realm response mirrors, artifact bytes, decoded audio buffers, uploaded reference audio, or active job projections across restarts in localStorage, sessionStorage, or IndexedDB. Track whether the current draft write succeeded; report failures visibly and allow retry without clearing in-memory writing or completed-result references.
    condition: When application state is stored locally.
    failure: Reject the persistence write, remove prohibited retained data, and surface a typed storage-boundary error where the user action cannot complete.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.generation-job
      - type: applies_to
        target: definition.overtone.data-model.song-project
      - type: applies_to
        target: definition.overtone.data-model.take-artifact
  - id: rule.overtone.data-model.r009
    kind: rule
    title: Publish draft provenance
    modality: must
    statement: Allocate no publish draft, provenance form or publication state while the protected Realm publish operation is unavailable.
    condition: When preparing or initiating Realm publish.
    failure: Expose no publication action, form or upload while the protected publication operation is unavailable.
    relations:
      - type: applies_to
        target: definition.overtone.realm.publish-surface
  - id: rule.overtone.data-model.r010
    kind: rule
    title: Fresh readiness projection
    modality: must
    statement: Compute protected session status and configured text and music availability afresh; checking shows neutral progress, and only a completed probe may report missing capabilities. Do not project unqueried Realm status as false facts.
    condition: On every readiness pass.
    failure: Mark the affected capability unavailable or not configured and expose a typed readiness state without fabricated authority or binding material.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.readiness-snapshot
