format: nimicoding.authority/v2
owner: team.overtone
scope: overtone.realm
units:
  - id: definition.overtone.realm.publish-surface
    kind: definition
    title: Realm publish surface
    meaning: Publication is unavailable on the current protected Local App contract; Overtone exposes no publish action or form.
  - id: rule.overtone.realm.r001
    kind: rule
    title: App Access publish entry
    modality: must
    statement: Access Realm publish only through an authoritative protected operation admitted to NimiLocalAppClient, without constructing a Realm HTTP client, reading a bearer token, or invoking SDK Realm helpers directly from Overtone.
    condition: When Realm publish becomes admitted.
    failure: Keep Realm publish unavailable and render its typed App Access explanation.
    relations:
      - type: applies_to
        target: definition.overtone.realm.publish-surface
  - id: rule.overtone.realm.r002
    kind: rule
    title: Realm readiness unavailable
    modality: must
    statement: Keep Realm publication unavailable and omit unqueried Realm account or configuration projections. Do not infer Realm facts from URLs, raw tokens or Runtime accounts.
    condition: On every readiness pass before Realm App Access admission.
    failure: Expose no publish action or fabricated Realm readiness.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.readiness-snapshot
      - type: applies_to
        target: definition.overtone.realm.publish-surface
  - id: rule.overtone.realm.r003
    kind: rule
    title: Publish remains fail closed
    modality: must_not
    statement: Upload take audio, create a Realm post, return a fabricated post identifier, or transition publishStatus to done while the protected publish operation is unavailable.
    condition: Until App Access admits and implements Realm publish.
    failure: Omit unavailable publication UI and preserve the author draft and audio references.
    relations:
      - type: applies_to
        target: definition.overtone.realm.publish-surface
  - id: rule.overtone.realm.r004
    kind: rule
    title: Explicit provenance confirmation
    modality: must_not
    statement: Issue any future publish call without explicit provenance confirmation through a checkbox bound to a human-readable rights statement.
    condition: Before any admitted publish call.
    failure: Block publish and prompt for explicit provenance confirmation.
    relations:
      - type: applies_to
        target: definition.overtone.realm.publish-surface
  - id: rule.overtone.realm.r005
    kind: rule
    title: Source-mode mapping
    modality: must
    statement: Keep origin prompt and optional textual parent lineage on generated audio; never represent textual reinterpretation as audio derivation or publication.
    condition: When creating a playable music take.
    failure: Preserve textual lineage without claiming audio derivation or publication.
    relations:
      - type: applies_to
        target: definition.overtone.data-model.song-take
      - type: applies_to
        target: definition.overtone.realm.publish-surface
  - id: rule.overtone.realm.r006
    kind: rule
    title: No social shell surfaces
    modality: must_not
    statement: Link to or embed Realm comment, follow, like, repost, profile-edit, or direct-message surfaces in Overtone P0, P1, or P2.
    condition: Always.
    failure: Fail product validation and keep the out-of-scope Realm surface unavailable.
    relations:
      - type: applies_to
        target: definition.overtone.realm.publish-surface
