app_id: nimi.overtone
display_name: Nimi Overtone
version: 0.1.7
profile: standalone
npm_package_name: nimiapp-overtone
cargo_package_name: nimiapp-overtone-shell
tauri_identifier: ai.nimi.apps.nimi.overtone
package_author: Nimi Overtone
submission_role: developer-submitted-input
capability_contract_refs:
  - text.generate
  - music.generate
required_standardized_feature_refs: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: <Electron userData>/Local Storage/**
      purpose: Non-secret language, theme and volume preferences, plus retired browser draft metadata retained for explicit one-time recovery. Current projects, adopted audio and score assets use protected Nimi-mediated App storage. Browser preferences and retired drafts remain when the app is uninstalled from Nimi.
      expected_size_band: Typically KiB to a few MiB of JSON, subject to browser storage quota.
safety_profile:
  ai:
    direct_interaction: true
    interaction_notice: absent
    outputs:
      - export_visible_marking: absent
        exposure: exportable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: text
        publication_control: not-applicable
      - export_visible_marking: absent
        exposure: exportable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: audio
        publication_control: not-applicable
    risk_features: []
    subject_notice: not-applicable
  content_descriptors: []
  data_practices:
    commercial_features: []
    publisher_direct_external_network: false
    sensitive_data_categories: []
    telemetry: []
    third_party_account: none
    user_content_sharing: none
  high_impact_decision_uses: []
  intended_audience: general
support_manifest:
  diagnostics_bundle_fields:
    - app_version
    - runtime_status
  redaction_rules:
    - credentials
  user_visible_issue_categories:
    - startup
    - runtime
  escalation_path: https://github.com/nimiplatform/nimiapp-overtone/issues
  kill_switch_visibility: visible
  recovery_instructions: Restart the App from Nimi. If the problem persists, reinstall the current admitted release.
review_inputs:
  manifest: nimi.app.yaml
  build_profile: .nimi/config/build-profile.yaml
  scaffold_boundary: .nimi/contracts/scaffold-boundary.yaml
admission_truth: platform-owned-after-review
