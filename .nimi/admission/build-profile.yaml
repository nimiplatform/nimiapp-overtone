build_profile_ref: electron-packager-pnpm-vite
toolchain_version: node>=24;pnpm=10.34.5;electron=42
install_command: pnpm install
dev_command: pnpm dev
dev_renderer_command: pnpm dev:renderer
dev_electron_command: pnpm dev:electron
typecheck_command: pnpm typecheck
test_command: pnpm test
build_command: pnpm run build
build_electron_command: pnpm build:electron
output_path: dist-electron-package
electron_output_path: dist-electron
renderer_output_path: dist
lockfile_path: pnpm-lock.yaml
lockfile_policy: author-install-generates-lockfile
ci_install_command: pnpm install --frozen-lockfile
profile_role: developer-workflow-input
