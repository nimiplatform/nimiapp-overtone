app_id: nimi.overtone
display_name: Nimi Overtone
version: 0.1.8
profile: standalone
manifest_role: submitted-input
app_access:
  - runtime.consume
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1507
  web:
    command: pnpm run dev:web-renderer
    local:
      origin: https://127.0.0.1:4474
      redirect_uri: https://127.0.0.1:4474/
      client_id: nimi.overtone.web.dev
  mobile:
    command: pnpm run dev:android
metadata:
  summary: 整理音乐创作项目、歌词与音频候选，比较和管理创作版本。
  icon: assets/app-icon.png
  release_notes: RELEASE_NOTES.md
  author: Nimi Overtone
  homepage_url: https://github.com/nimiplatform/nimiapp-overtone
  support_url: https://github.com/nimiplatform/nimiapp-overtone/issues
capability_contract_refs:
  - text.generate
  - music.generate
  - music.transcribe
  - audio.voice.convert
  - audio.separate
required_standardized_feature_refs: []
safety_profile:
  intended_audience: general
  content_descriptors: []
  ai:
    direct_interaction: true
    interaction_notice: absent
    risk_features: []
    subject_notice: not-applicable
    outputs:
      - modality: text
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: audio
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
  data_practices:
    publisher_direct_external_network: false
    telemetry: []
    third_party_account: none
    user_content_sharing: private
    commercial_features: []
    sensitive_data_categories: []
  high_impact_decision_uses: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: <Android app cache>/overtone-media/**
      purpose: Stage the selected Runtime-owned audio in bounded chunks for local file playback. The player releases this temporary copy; canonical media remains in protected Runtime App storage.
      expected_size_band: One selected media file per active player, within the App's existing import limits.
    - path_pattern: <Android app cache>/overtone-exports/**
      purpose: On explicit export, stage the selected owned audio or score for the Android system share sheet. The recipient is selected by the user; canonical media remains in protected Runtime App storage. Android may evict cached files.
      expected_size_band: One selected media file per export; depends on duration and format.
    - path_pattern: <Electron userData>/Local Storage/**
      purpose: Non-secret language, theme and volume preferences. Current projects and
        adopted audio and score assets use protected Nimi-mediated App storage.
        Retired browser drafts are unsupported development residue, not a
        recovery feature; this unlaunched candidate does not preserve prior
        development projects. Browser preferences may remain when the app is
        uninstalled from Nimi.
      expected_size_band: Typically KiB to a few MiB of JSON, subject to browser storage quota.
